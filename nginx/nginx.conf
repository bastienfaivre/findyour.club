events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;  # Correct Content-Type headers for all served file types
  server_tokens off;              # Don't expose Nginx version in headers/error pages
  client_max_body_size 50m;       # Allow file uploads up to 50 MB

  upstream nextjs {
    server nextjs:3000;
  }

  # Only accept connections from Cloudflare IPs
  # IPv4 — https://www.cloudflare.com/ips-v4/
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  # IPv6 — https://www.cloudflare.com/ips-v6/
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  # Deny direct access — only Cloudflare-proxied traffic allowed
  geo $realip_remote_addr $is_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
  }

  # Redirect HTTP → HTTPS (Cloudflare-only)
  server {
    listen 80;
    server_name findyour.club;

    if ($is_cloudflare = 0) {
      return 403;
    }

    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;  # requires nginx >= 1.25.1
    server_name findyour.club;

    # Cloudflare Origin Certificate (generate at Cloudflare dashboard → SSL/TLS → Origin Server)
    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Block non-Cloudflare traffic
    if ($is_cloudflare = 0) {
      return 403;
    }

    # Serve maintenance page on upstream errors
    error_page 502 503 /maintenance.html;
    location = /maintenance.html {
      root /var/www/maintenance;
      internal;
    }

    location / {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
