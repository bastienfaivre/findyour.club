events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;  # Correct Content-Type headers for all served file types
  server_tokens off;              # Don't expose Nginx version in headers/error pages
  client_max_body_size 50m;       # Allow file uploads (MinIO integration — Epic 5)

  upstream nextjs {
    server nextjs:3000;
  }

  server {
    listen 80;
    server_name _;

    # Serve maintenance page on upstream errors
    error_page 502 503 /maintenance.html;
    location = /maintenance.html {
      root /var/www/maintenance;
      internal;
    }

    location / {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
